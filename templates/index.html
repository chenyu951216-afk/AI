<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Strategy Lab</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#0b0f14;color:#e6edf3}header{padding:20px 24px;border-bottom:1px solid #202938}.wrap{padding:20px;max-width:1500px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,.panel{background:#111821;border:1px solid #253041;border-radius:12px;padding:14px}.big{font-size:24px;font-weight:700}.muted{color:#8b98a8;font-size:13px}.ok{color:#3ddc97}.bad{color:#ff6b6b}.warn{color:#ffd166}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #253041;text-align:left;white-space:nowrap}th{color:#9fb0c3}.panel{margin-top:14px;overflow:auto}.stage{padding:3px 8px;border-radius:999px;background:#243047}code{color:#9fd3ff}button{background:#238636;border:0;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}.right{text-align:right}.pos{color:#3ddc97}.neg{color:#ff6b6b}</style></head>
<body><header><b>Crypto Strategy Lab</b> <span class="muted">多策略紙上交易 / 自動學習 / Bitget final-only live gate</span></header><div class="wrap">
<div class="cards" id="overview"></div>
<div class="panel"><h3>策略帳戶</h3><table><thead><tr><th>策略</th><th>階段</th><th>Equity</th><th>總報酬</th><th>今日/累積交易</th><th>勝率</th><th>PF</th><th>Expectancy</th><th>Open</th><th>Live</th></tr></thead><tbody id="strategies"></tbody></table></div>
<div class="panel"><h3>目前持倉</h3><table><thead><tr><th>策略</th><th>幣</th><th>方向</th><th>進場</th><th>止損</th><th>TP1</th><th>TP2</th><th>TP3</th><th>剩餘數量</th></tr></thead><tbody id="positions"></tbody></table></div>
<div class="panel"><h3>最近訊號</h3><table><thead><tr><th>時間</th><th>策略</th><th>幣</th><th>方向</th><th>Score</th><th>進場</th><th>止損</th><th>原因</th></tr></thead><tbody id="signals"></tbody></table></div>
<div class="panel"><h3>學習 / 調整紀錄</h3><table><thead><tr><th>時間</th><th>策略</th><th>類型</th><th>原因</th><th>是否採用</th></tr></thead><tbody id="adj"></tbody></table></div>
<div class="panel"><h3>每日統計</h3><table><thead><tr><th>日期</th><th>策略</th><th>交易數</th><th>勝率</th><th>PnL</th></tr></thead><tbody id="daily"></tbody></table></div>
</div><script>
const f=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:4});const t=x=>x?new Date(x).toLocaleString('zh-TW',{hour12:false}):'-';
async function get(u){return (await fetch(u)).json()} async function refresh(){let [o,s,p,g,a,d]=await Promise.all([get('/api/overview'),get('/api/strategies'),get('/api/positions'),get('/api/signals?limit=50'),get('/api/adjustments?limit=50'),get('/api/daily')]);
overview.innerHTML=[['掃描狀態',o.running?'RUNNING':'STOPPED'],['掃描幣池',o.universe_size],['24h 已實現 PnL',f(o.daily_realized_pnl)+' U'],['CoinGlass',o.coinglass_connected?'CONNECTED':'NO KEY'],['真實下單',o.live_trading_enabled?'UNLOCKED':'LOCKED'],['最後掃描',t(o.last_scan)]].map(x=>`<div class=card><div class=muted>${x[0]}</div><div class=big>${x[1]}</div></div>`).join('');
strategies.innerHTML=s.map(x=>`<tr><td>${x.name}<div class=muted>${x.strategy}</div></td><td><span class=stage>${x.stage}</span></td><td>${f(x.equity)} U</td><td class=${x.return_pct>=0?'pos':'neg'}>${x.return_pct}%</td><td>${x.trades}</td><td>${x.win_rate}%</td><td>${x.profit_factor}</td><td>${f(x.expectancy)}</td><td>${x.open_positions}</td><td>${x.live_eligible?'ELIGIBLE':'NO'}</td></tr>`).join('');
positions.innerHTML=p.length?p.map(x=>`<tr><td>${x.strategy}</td><td>${x.symbol}</td><td>${x.side}</td><td>${f(x.entry)}</td><td>${f(x.stop)}</td><td>${f(x.tp1)}</td><td>${f(x.tp2)}</td><td>${f(x.tp3)}</td><td>${f(x.remaining_qty)}</td></tr>`).join(''):'<tr><td colspan=9 class=muted>目前沒有持倉</td></tr>';
signals.innerHTML=g.map(x=>`<tr><td>${t(x.created_at)}</td><td>${x.strategy}</td><td>${x.symbol}</td><td>${x.side}</td><td>${x.score}</td><td>${f(x.entry)}</td><td>${f(x.stop)}</td><td>${x.reason}</td></tr>`).join('');
adj.innerHTML=a.map(x=>`<tr><td>${t(x.created_at)}</td><td>${x.strategy}</td><td>${x.kind}</td><td>${x.reason}</td><td>${x.accepted?'YES':'NO'}</td></tr>`).join('');
daily.innerHTML=d.map(x=>`<tr><td>${x.day}</td><td>${x.strategy}</td><td>${x.trades}</td><td>${x.win_rate}%</td><td class=${x.pnl>=0?'pos':'neg'}>${f(x.pnl)} U</td></tr>`).join('');}
refresh();setInterval(refresh,15000)</script></body></html>
